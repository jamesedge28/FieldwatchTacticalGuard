name: FieldwatchTacticalGuard
options:
  bundleIdPrefix: com.fieldwatch
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  FieldwatchTacticalGuard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Theme
      - path: ViewModels
      - path: Views
    info:
      path: App/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "Fieldwatch Tactical Guard requiere acceso pasivo a Bluetooth para rastrear balizas espía, transmisores encubiertos y triangular zonas ciegas RF."
        NSBluetoothPeripheralUsageDescription: "Permite el escaneo radioeléctrico en tiempo real para detección de contrainteligencia."
        NSCameraUsageDescription: "Fieldwatch Tactical Guard requiere la cámara trasera para filtrar ópticamente destellos infrarrojos invisibles y ejecutar reconstrucción 3D con LiDAR."
        NSMicrophoneUsageDescription: "Requerido para generar alertas acústicas y calibración táctica del entorno."
        UILaunchScreen: {}
        UIStatusBarStyle: "UIStatusBarStyleLightContent"
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fieldwatch.tacticalguard
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
